[project]
name = "durable-eval-temporal"
version = "0.1.0"
description = "A durable model-evaluation harness on Temporal: retries, crash recovery, human approval, versioning and fan-out, measured against a plain loop."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "av>=13",
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "huggingface_hub>=0.25",
    "remotezip>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
